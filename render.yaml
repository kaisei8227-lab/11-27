# Render の Blueprint（New → Blueprint でこのファイルを読み込むと、Webサービスとデータベースが一度に作られる）
databases:
  - name: card-game-db
    plan: free
    region: singapore
    databaseName: cardgame
    user: cardgame

services:
  - type: web
    name: card-game
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login.html
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: card-game-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: card-game-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: card-game-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: card-game-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: card-game-db
          property: password
