<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="js/sync.js"></script>
    <script src="/js/auth-check.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Duel - ソロバトル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:wght@400..800&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/battle.css">
</head>
<body data-mode="stage">
<div id="board">
    <!-- ===== 左上: ターン数・デッキ名 ===== -->
    <div class="top-left-ui">
        <button type="button" id="menu-btn" class="menu-btn" title="メニュー">⚙</button>
        <div class="turn-badge">TURN <span id="turn-count">1</span></div>
        <div class="deck-badge" id="deck-name">デッキ: 読込中</div>
    </div>

    <!-- ===== 相手側 ===== -->
    <div id="opp-hand" class="opp-hand"></div>

    <div id="opp-info" class="side-info opp">
        <div class="deck-count" title="相手の山札"><span class="deck-icon"></span><b id="opp-deck">0</b></div>
        <div class="grave-count" title="相手の墓地">墓地 <b id="opp-grave">0</b></div>
        <div class="pp-box"><div class="pp-label">PP</div><div class="pp-num" id="opp-pp">0/0</div></div>
        <div class="ep-orbs" id="opp-ep"></div>
    </div>

    <div id="opp-leader" class="leader opp" data-target="opp-leader">
        <div class="leader-frame"><div class="leader-portrait"></div></div>
        <div class="leader-name" id="opp-name">CPU</div>
        <div class="leader-hp"><span id="opp-hp">30</span></div>
        <div class="crests" id="opp-crests"></div>
    </div>

    <div id="opp-field" class="field opp"></div>

    <div class="divider"><span></span></div>

    <!-- ===== 自分側 ===== -->
    <div id="my-field" class="field mine"></div>

    <div id="my-leader" class="leader mine">
        <div class="leader-frame"><div class="leader-portrait"></div></div>
        <div class="leader-name" id="my-name">あなた</div>
        <div class="leader-hp"><span id="my-hp">30</span></div>
        <div class="crests" id="my-crests"></div>
    </div>

    <div id="my-info" class="side-info mine">
        <div class="ep-orbs" id="my-ep"></div>
        <div class="pp-box big">
            <div class="pp-label">PP</div>
            <div class="pp-num" id="my-pp">0/0</div>
            <div class="pp-orbs" id="my-pp-orbs"></div>
        </div>
        <button type="button" id="extra-pp" class="extra-pp hidden" title="後攻だけ使える：このターンだけPP+1（5ターン目までに1回・6ターン目以降に1回）">
            EX PP <span class="xpp-plus">+1</span> <small>残り<span class="xpp-count">2</span></small>
        </button>
        <div class="info-row">
            <div class="deck-count" title="山札"><span class="deck-icon"></span><b id="my-deck">0</b></div>
            <div class="grave-count" title="墓地">墓地 <b id="my-grave">0</b></div>
        </div>
    </div>

    <div id="hand" class="hand"></div>

    <button id="end-turn" class="end-turn" type="button">
        <span class="end-turn-ring"></span>
        <span class="end-turn-label">ターン終了</span>
        <span class="end-turn-timer" id="turn-timer"></span>
    </button>

    <!-- AIアドバイス（CPU戦のみ） -->
    <button type="button" id="advice-btn" class="advice-btn hidden" title="AIがおすすめの手を教えてくれます">💡 AIアドバイス</button>
    <div id="advice-panel" class="advice-panel hidden">
        <div class="advice-head">AI ADVICE <button type="button" id="advice-close">×</button></div>
        <ol id="advice-list"></ol>
    </div>

    <!-- カード詳細（ホバー時） -->
    <aside id="detail" class="detail hidden"></aside>

    <!-- 対戦ログ（直近）と、メニューから開く全ログ -->
    <div id="log" class="log"></div>
    <div id="log-panel" class="log-panel hidden">
        <div class="log-panel-head">BATTLE LOG <button type="button" id="log-close">×</button></div>
        <div class="log-panel-body" id="log-panel-body"></div>
    </div>

    <!-- カードを出した時の大きな表示 -->
    <div id="cutin" class="cutin hidden"></div>

    <!-- マリガン（最初の手札の入れ替え） -->
    <div id="mulligan" class="mulligan hidden">
        <div class="mulligan-title">手札の入れ替え</div>
        <div class="mulligan-sub" id="mulligan-sub">入れ替えたいカードを選んでください</div>
        <div class="mulligan-cards" id="mulligan-cards"></div>
        <button type="button" id="mulligan-ok" class="mulligan-ok">決定</button>
    </div>

    <!-- 演出用レイヤー -->
    <svg id="arrow-layer" class="arrow-layer">
        <defs>
            <linearGradient id="arrow-grad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#f6d77a" stop-opacity="0.2"/>
                <stop offset="1" stop-color="#ffe9a8"/>
            </linearGradient>
            <marker id="arrow-head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#ffe9a8"/>
            </marker>
        </defs>
        <path id="arrow-path" d="" />
    </svg>
    <div id="fx-layer" class="fx-layer"></div>
    <div id="drag-layer" class="drag-layer"></div>

    <div id="target-hint" class="target-hint hidden">
        <span id="target-hint-text">対象を選んでください</span>
        <button id="target-cancel" type="button">キャンセル</button>
    </div>

    <div id="banner" class="banner hidden"><span id="banner-text"></span></div>

    <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

    <!-- 勝利時の十字架演出 -->
    <div id="gothic-cross" class="gothic-cross hidden">
        <div class="gothic-cross-symbol">✝</div>
        <div class="gothic-cross-title">GLORY OF BLOOD</div>
        <div class="gothic-cross-sub">闇夜の決戦を制しました</div>
    </div>

    <!-- リザルト -->
    <div id="result" class="result hidden">
        <div class="result-box">
            <div class="result-title" id="result-title">VICTORY</div>
            <div class="result-sub" id="result-sub">栄光の凱旋</div>
            <div class="reward-grid">
                <div class="reward-row"><span>獲得 MP</span><span class="reward-val mp" id="res-mp">+100 MP</span></div>
                <div class="reward-row"><span>コイン</span><span class="reward-val" id="res-coin">+150</span></div>
                <div class="reward-row"><span id="res-streak-label">連勝</span><span class="reward-val" id="res-streak">1 連勝中</span></div>
                <div class="reward-row rank-up hidden" id="res-rank-row"><span>★ ランク昇格！</span><span class="reward-val mp" id="res-rank">Bronze I</span></div>
            </div>
            <div class="result-buttons">
                <button type="button" id="btn-retry">もう一度</button>
                <button type="button" id="btn-home" class="primary">プロフィールへ進む</button>
            </div>
        </div>
    </div>
</div>

<script src="js/rank_util.js"></script>
<script src="js/effects.js"></script>
<script src="js/cards.js"></script>
<script src="js/missions.js"></script>
<script src="js/cosmetics.js"></script>
<script src="js/battlepass.js"></script>
<script src="js/battle.js"></script>
</body>
</html>
