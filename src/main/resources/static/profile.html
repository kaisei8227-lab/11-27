<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Duel - プロフィール</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'EB Garamond', serif;
            background: #080d1a;
            color: #e0d8e8;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ヘッダー */
        header {
            display: flex; align-items: center; padding: 12px 25px;
            background: rgba(15, 10, 23, 0.9); border-bottom: 1px solid rgba(201, 160, 80, 0.3);
            position: sticky; top: 0; z-index: 50;
        }
        .btn-back {
            background: rgba(45, 27, 78, 0.6); border: 1px solid #c9a050; color: #c9a050;
            padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
            font-size: 13px;
        }
        .btn-back:hover { background: #2b1a3a; color: #fff; }

        /* メインコンテナ */
        .profile-container {
            flex: 1; margin: 20px 30px; display: grid; grid-template-columns: 280px 1fr; gap: 20px;
        }

        /* 左パネル */
        .profile-left-box {
            background: rgba(18, 12, 28, 0.9); border: 1px solid rgba(201, 160, 80, 0.4); border-radius: 10px;
            padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .prof-avatar {
            width: 100px; height: 100px; border-radius: 50%; border: 3px solid #c9a050;
            background: #1a1028; font-size: 50px; display: flex; justify-content: center; align-items: center;
            margin-bottom: 12px; box-shadow: 0 0 15px rgba(201, 160, 80, 0.4); overflow: hidden;
        }

        /* プレイヤー名表示＆編集領域 */
        .name-container {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 12px; width: 100%;
        }
        .prof-name {
            font-size: 18px; font-weight: bold; color: #f1e6cf;
            font-family: 'Cinzel Decorative', serif;
            max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .btn-edit-name {
            background: rgba(201, 160, 80, 0.2); border: 1px solid #c9a050; color: #c9a050;
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 12px;
            transition: all 0.2s; flex-shrink: 0;
        }
        .btn-edit-name:hover { background: #c9a050; color: #080d19; transform: scale(1.1); }

        .title-badge {
            background: linear-gradient(135deg, #4a1d6d, #230d35); border: 1px solid #c9a050;
            color: #ffd700; padding: 6px 20px; border-radius: 20px; font-size: 12px; font-weight: bold;
            margin-bottom: 8px;
        }
        
        /* 称号変更ボタン */
        .btn-change-title {
            background: rgba(201, 160, 80, 0.15); border: 1px solid #c9a050; color: #ffd700;
            padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; margin-bottom: 15px;
        }
        .btn-change-title:hover { background: #c9a050; color: #080d19; transform: scale(1.05); }

        /* 右パネル */
        .profile-right-box {
            background: rgba(18, 12, 28, 0.9); border: 1px solid rgba(201, 160, 80, 0.4); border-radius: 10px;
            padding: 20px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .info-card {
            background: rgba(12, 8, 18, 0.7); border: 1px solid rgba(201, 160, 80, 0.2);
            border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .rank-title-display { font-family: 'Cinzel Decorative', serif; font-size: 20px; color: #ffd700; font-weight: bold; }
        
        /* 7クラス別勝利数グラフ */
        .class-wins-section {
            background: rgba(12, 8, 18, 0.7); border: 1px solid rgba(201, 160, 80, 0.2);
            border-radius: 8px; padding: 14px 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between;
        }
        .chart-bars {
            display: flex; justify-content: space-around; align-items: flex-end; height: 110px; padding: 0 5px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; width: 36px; color: #d0c4de; }
        .bar-fill { width: 14px; border-radius: 3px 3px 0 0; transition: height 0.4s ease-out; }
        .bar-num { font-size: 10px; color: #c9a050; font-weight: bold; }

        /* モーダル共通スタイル */
        .modal-overlay, .title-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .edit-modal, .title-modal-box {
            background: rgba(18, 12, 28, 0.95); border: 2px solid #c9a050; border-radius: 12px;
            padding: 24px; width: 340px; text-align: center; box-shadow: 0 0 25px rgba(201, 160, 80, 0.4);
            display: flex; flex-direction: column; gap: 12px;
        }
        .edit-input {
            width: 100%; padding: 10px; margin: 10px 0; background: #080d19; border: 1px solid #4a3e56;
            border-radius: 6px; color: #fff; font-size: 14px; text-align: center; outline: none;
        }
        .edit-input:focus { border-color: #c9a050; }

        /* 称号リストコンテナ */
        .title-list-container {
            display: flex; flex-direction: column; gap: 6px;
            max-height: 150px; overflow-y: auto; padding: 4px; text-align: left;
        }
        .title-item {
            background: rgba(25, 18, 38, 0.9); border: 1px solid #4a3e56; border-radius: 6px;
            padding: 10px; color: #f1e6cf; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .title-item:hover { border-color: #c9a050; background: rgba(45, 30, 68, 0.9); }
        .title-item.selected {
            border-color: #ffd700; background: linear-gradient(135deg, #3a2552, #1a102b);
            color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        footer {
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(12, 8, 18, 0.95); border-top: 1px solid rgba(201, 160, 80, 0.3); padding: 10px 0;
        }
        .nav-item { color: #a792ba; font-size: 13px; text-decoration: none; font-weight: bold; cursor: pointer; }
        .nav-item:hover { color: #ffd700; }

        @media screen and (max-width: 768px) {
            body { overflow-y: auto; }
            header { padding: 10px 15px; }
            .profile-container { grid-template-columns: 1fr; margin: 12px 15px; gap: 12px; }
            .profile-left-box, .profile-right-box { padding: 15px; }
            .chart-bars { height: 90px; }
            .bar-col { width: 28px; font-size: 10px; }
            .bar-fill { width: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <button class="btn-back" onclick="location.href='home.html'">❮ ホームへ戻る</button>
    </header>

    <div class="profile-container">
        <!-- 左カラム -->
        <div class="profile-left-box">
            <div class="prof-avatar">🧙‍♂️</div>
            
            <div class="name-container">
                <div class="prof-name" id="prof-username">プレイヤー</div>
                <button class="btn-edit-name" onclick="openNameModal()" title="名前を変更">✏️</button>
            </div>

            <div class="title-badge" id="prof-current-title">称号なし</div>
            <button class="btn-change-title" onclick="openTitleModal()">称号を変更</button>

            <button class="btn-back" style="width: 100%; margin-top: auto;" onclick="alert('スキン変更機能は未実装です')">スキン変更</button>
        </div>

        <!-- 右カラム -->
        <div class="profile-right-box">
            <!-- ランク情報 -->
            <div class="info-card">
                <div>
                    <div style="font-size: 11px; color: #a792ba; margin-bottom: 2px;">ランクマッチ</div>
                    <div class="rank-title-display" id="prof-rank-name">Beginner 0</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 15px; color: #ffd700; font-weight: bold;" id="prof-mp-text">MP 0</div>
                    <div style="font-size: 11px; color: #a792ba;" id="prof-next-mp">NEXT昇格まで あと 200 MP</div>
                </div>
            </div>

            <!-- 所属グループ情報 -->
            <div class="info-card" style="border-color: rgba(72, 187, 120, 0.3);">
                <div>
                    <div style="font-size: 11px; color: #a792ba; margin-bottom: 2px;">所属グループ</div>
                    <div style="font-family: 'Cinzel Decorative', serif; font-size: 18px; font-weight: bold;" id="prof-group-name">🟢 エメラルド</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 13px; color: #ffd700; font-weight: bold;" id="prof-group-bonus">勝利時 MP +100</div>
                    <div style="font-size: 11px; color: #a792ba;" id="prof-win-streak">0 連勝中</div>
                </div>
            </div>

            <!-- 7クラス別勝利数グラフ -->
            <div class="class-wins-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 13px; color: #c9a050; font-weight: bold;">ランクマッチ：クラス別勝利数</span>
                    <span style="font-size: 13px; color: #f1e6cf;">総勝利数: <strong id="total-wins" style="color:#ffd700;">0</strong></span>
                </div>

                <div class="chart-bars">
                    <div class="bar-col"><span class="bar-num" id="win-noble">0</span><div class="bar-fill" id="bar-noble" style="height: 0px; background: #ecc94b;"></div><span>貴族</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-monster">0</span><div class="bar-fill" id="bar-monster" style="height: 0px; background: #ed8936;"></div><span>怪物</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-ghost">0</span><div class="bar-fill" id="bar-ghost" style="height: 0px; background: #a0aec0;"></div><span>幽霊</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-witch">0</span><div class="bar-fill" id="bar-witch" style="height: 0px; background: #9f7aea;"></div><span>魔女</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-doll">0</span><div class="bar-fill" id="bar-doll" style="height: 0px; background: #f687b3;"></div><span>人形</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-hunter">0</span><div class="bar-fill" id="bar-hunter" style="height: 0px; background: #48bb78;"></div><span>狩人</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-pirate">0</span><div class="bar-fill" id="bar-pirate" style="height: 0px; background: #319795;"></div><span>海賊</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 名前変更モーダル -->
    <div id="name-modal" class="modal-overlay">
        <div class="edit-modal">
            <div style="color: #c9a050; font-weight: bold; font-size: 16px;">プレイヤー名の変更</div>
            <input type="text" id="new-name-input" class="edit-input" maxlength="12" placeholder="新しい名前を入力">
            <div style="display: flex; gap: 10px;">
                <button class="btn-back" style="flex: 1;" onclick="closeNameModal()">キャンセル</button>
                <button class="btn-back" style="flex: 1; background: #c9a050; color: #080d19;" onclick="saveName()">保存</button>
            </div>
        </div>
    </div>

    <!-- 称号選択・追加モーダル -->
    <div id="title-select-modal" class="title-modal-overlay" onclick="closeTitleModal()">
        <div class="title-modal-box" onclick="event.stopPropagation()">
            <div style="font-family: 'Cinzel Decorative', serif; font-size: 18px; color: #ffd700; font-weight: bold;">TITLE MANAGEMENT</div>
            <div style="font-size: 11px; color: #a792ba;">称号の選択、または新しい称号の作成</div>

            <!-- 称号追加用入力フィールド -->
            <div style="display: flex; gap: 6px; margin-top: 4px;">
                <input type="text" id="new-title-input" class="edit-input" style="margin: 0; font-size: 12px;" maxlength="15" placeholder="新しい称号を入力...">
                <button class="btn-back" style="background: #c9a050; color: #080d19; white-space: nowrap; padding: 0 10px;" onclick="addNewTitle()">追加</button>
            </div>

            <div class="title-list-container" id="title-list-box">
                <!-- 動的に解放済み称号リストが生成されます -->
            </div>

            <button class="btn-back" style="width: 100%; margin-top: 4px;" onclick="closeTitleModal()">閉じる</button>
        </div>
    </div>

    <footer>
        <a class="nav-item" href="home.html">🏠 ホームへ戻る</a>
    </footer>

    <!-- ランク・グループ判定スクリプト -->
    <script src="js/auth-check.js"></script>
    <script src="js/rank_util.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/cosmetics.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
        });

        function loadUserData() {
            const storedUser = localStorage.getItem('user');
            if (!storedUser) {
                document.getElementById('prof-username').innerText = 'プレイヤー';
                document.getElementById('prof-current-title').innerText = '称号なし';
                return;
            }

            try {
                const user = JSON.parse(storedUser);
                const userMp = user.mp || 0;
                const winStreak = user.winStreak || 0;

                // 1. プレイヤー名 & 称号の反映
                document.getElementById('prof-username').innerText = user.username || 'プレイヤー';
                document.getElementById('prof-current-title').innerText = Cosmetics.titleName(Cosmetics.ensure(user)) || '称号なし';
                document.querySelector('.prof-avatar').innerHTML = Cosmetics.avatarSvg(Cosmetics.equipped(user), 96);

                // 2. ランク情報の動的計算
                const rankInfo = typeof getRankInfo === 'function' ? getRankInfo(userMp) : { name: 'Beginner 0', nextMp: 200 };
                document.getElementById('prof-rank-name').innerText = rankInfo.name;
                document.getElementById('prof-mp-text').innerText = 'MP ' + userMp;
                document.getElementById('prof-next-mp').innerText = 'NEXT あと ' + (rankInfo.nextMp || 200) + ' MP';

                // 3. グループ情報の動的計算
                const groupInfo = typeof getGroupInfo === 'function' ? getGroupInfo(user) : { name: 'エメラルド', mpBonus: 100, icon: '🟢', color: '#48bb78' };
                document.getElementById('prof-group-name').innerHTML = `${groupInfo.icon} <span style="color:${groupInfo.color}">${groupInfo.name}</span>`;
                document.getElementById('prof-group-bonus').innerText = `勝利時 MP +${groupInfo.mpBonus}`;
                // 直近10試合（対人戦）の勝率と、次のグループに上がる条件
                const recentWins = (user.recentPvp || []).filter(Boolean).length;
                const nextGroup = typeof GROUP_TABLE !== 'undefined' ? GROUP_TABLE[GROUP_TABLE.indexOf(groupInfo) + 1] : null;
                document.getElementById('prof-win-streak').innerText = nextGroup
                    ? `直近10戦 ${recentWins}勝（${recentWins * 10}%）／${nextGroup.name}まで勝率${nextGroup.promoteRate * 100}%`
                    : `直近10戦 ${recentWins}勝（${recentWins * 10}%）／最高グループ`;

                // 4. 7クラス勝利数データの反映
                const wins = user.classWins || { noble: 0, monster: 0, ghost: 0, witch: 0, doll: 0, hunter: 0, pirate: 0 };
                const classes = ['noble', 'monster', 'ghost', 'witch', 'doll', 'hunter', 'pirate'];
                let total = 0;
                let maxWin = 1;

                classes.forEach(c => {
                    const count = wins[c] || 0;
                    total += count;
                    if (count > maxWin) maxWin = count;
                });

                classes.forEach(c => {
                    const count = wins[c] || 0;
                    document.getElementById(`win-${c}`).innerText = count;
                    const height = count === 0 ? 0 : Math.max(12, Math.min(85, Math.round((count / maxWin) * 85)));
                    document.getElementById(`bar-${c}`).style.height = `${height}px`;
                });

                document.getElementById('total-wins').innerText = total;

            } catch (e) {
                console.error('UserData Load Error:', e);
            }
        }

        // --- 名前変更モーダルのロジック ---
        function openNameModal() {
            const currentName = document.getElementById('prof-username').innerText;
            document.getElementById('new-name-input').value = currentName;
            document.getElementById('name-modal').style.display = 'flex';
        }

        function closeNameModal() {
            document.getElementById('name-modal').style.display = 'none';
        }

        async function saveName() {
            const inputVal = document.getElementById('new-name-input').value.trim();
            if (!inputVal) return alert('名前を入力してください。');
            if (inputVal.length > 20) return alert('名前は20文字以内で入力してください。');

            let user = JSON.parse(localStorage.getItem('user') || '{}');
            // ログイン名もサーバー側で変わる（同じ名前の人がいると変更できない）
            if (user.id) {
                try {
                    const res = await fetch(`/api/users/${user.id}/name`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: inputVal })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) return alert(data.message || '名前を変更できませんでした。');
                } catch (e) {
                    return alert('サーバーに接続できませんでした。');
                }
            }
            user = JSON.parse(localStorage.getItem('user') || '{}');
            user.username = inputVal;
            localStorage.setItem('user', JSON.stringify(user));

            document.getElementById('prof-username').innerText = inputVal;
            closeNameModal();
        }

        // --- 称号: 持っている称号アイテム（バトルパス・ショップ・2Pick など）＋自作の称号 ---
        function openTitleModal() {
            document.getElementById('new-title-input').value = '';
            renderTitleList();
            document.getElementById('title-select-modal').style.display = 'flex';
        }

        function renderTitleList() {
            const user = Cosmetics.load();
            const current = Cosmetics.equipped(user).title;
            const listBox = document.getElementById('title-list-box');
            listBox.innerHTML = '';
            Cosmetics.titles(user).forEach((t) => {
                const item = document.createElement('div');
                item.className = `title-item ${t.id === current ? 'selected' : ''}`;
                item.innerText = `👑 ${t.name}`;
                item.onclick = () => selectNewTitle(t.id);
                listBox.appendChild(item);
            });
        }

        function addNewTitle() {
            const titleInput = document.getElementById('new-title-input');
            const newTitle = titleInput.value.trim();
            if (!newTitle) return alert('追加する称号を入力してください。');
            if (newTitle.length > 20) return alert('称号は20文字以内で入力してください。');

            const user = Cosmetics.load();
            user.unlockedTitles = user.unlockedTitles || [];
            if (Cosmetics.titles(user).some((t) => t.name === newTitle)) return alert('その称号はすでに存在します。');
            user.unlockedTitles.push(newTitle);
            Cosmetics.save(user);
            Cosmetics.equipTitle(`custom:${newTitle}`);

            document.getElementById('prof-current-title').innerText = newTitle;
            titleInput.value = '';
            renderTitleList();
            alert(`新しい称号「${newTitle}」を作成し、設定しました！`);
        }

        function closeTitleModal() {
            document.getElementById('title-select-modal').style.display = 'none';
        }

        function selectNewTitle(id) {
            Cosmetics.equipTitle(id);
            document.getElementById('prof-current-title').innerText = Cosmetics.titleName() || '称号なし';
            closeTitleModal();
        }
    </script>
</body>
</html>
