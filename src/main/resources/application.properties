# ===== パソコン（Eclipse）で動かす時の設定 =====
# Render では application-prod.properties の設定で上書きされる
spring.application.name=card-game
server.port=8080

# H2 データベースをファイルに保存する（プロジェクト直下の data/ フォルダ。再起動してもユーザーが消えない）
spring.datasource.url=jdbc:h2:file:./data/cardgame;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# テーブルはエンティティから自動で作る・列を追加する
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
