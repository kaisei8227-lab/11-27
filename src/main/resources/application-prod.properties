# ===== Render（本番）用の設定 =====
# SPRING_PROFILES_ACTIVE=prod の時だけ読み込まれ、application.properties の同じ項目を上書きする。

# Render が指定するポートで起動する
server.port=${PORT:8080}
server.address=0.0.0.0

# データベース
# Render の PostgreSQL の環境変数（DB_HOST など / DATABASE_URL）があれば、CardGameApplication がそちらに切り替える。
# 無い場合はサーバー内の H2 で起動する（再起動・スリープでデータが消えるので、本番は PostgreSQL を推奨）。
spring.datasource.url=jdbc:h2:file:/tmp/cardgame;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# テーブルはエンティティから自動で作る・列を追加する（データは消さない）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 本番では H2 コンソールや開発ツールを使わない
spring.h2.console.enabled=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
